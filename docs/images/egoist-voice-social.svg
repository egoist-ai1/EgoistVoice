<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Egoist Voice — локальная диктовка для Windows</title>
  <desc id="desc">Чёрно-красная обложка Egoist Voice с гранёным микрофоном и звуковой волной.</desc>
  <defs>
